<VirtualHost *:443>
    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/ssl.crt
    SSLCertificateKeyFile /etc/apache2/ssl/ssl.key
    ServerAdmin webmaster@wolfsellers.com
    ServerName chopo.ckt
    ServerAlias www.chopo.ckt
    DocumentRoot /var/www/html/
    ErrorLog /var/www/chopo.ckt/logs/chopo_error.log
    LogLevel warn
    CustomLog /var/www/chopo.ckt/logs/chopo_access.log combined
</VirtualHost>
