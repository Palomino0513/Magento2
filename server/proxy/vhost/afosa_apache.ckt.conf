<VirtualHost *:443>
    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/ssl.crt
    SSLCertificateKeyFile /etc/apache2/ssl/ssl.key
    ServerAdmin webmaster@wolfsellers.com
    ServerName afosa.ckt
    ServerAlias www.afosa.ckt
    DocumentRoot /var/www/html/
    ErrorLog /var/www/afosa.ckt/logs/afosa_error.log
    LogLevel warn
    CustomLog /var/www/afosa.ckt/logs/afosa_access.log combined
</VirtualHost>
