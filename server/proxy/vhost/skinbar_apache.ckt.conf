<VirtualHost *:443>
    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/ssl.crt
    SSLCertificateKeyFile /etc/apache2/ssl/ssl.key
    ServerAdmin webmaster@wolfsellers.com
    ServerName skinbar.ckt
    ServerAlias www.skinbar.ckt
    DocumentRoot /var/www/html/
    ErrorLog /var/www/skinbar.ckt/logs/skinbar_error.log
    LogLevel warn
    CustomLog /var/www/skinbar.ckt/logs/skinbar_access.log combined
</VirtualHost>
