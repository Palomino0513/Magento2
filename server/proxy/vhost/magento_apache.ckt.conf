<VirtualHost *:443>
    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/ssl.crt
    SSLCertificateKeyFile /etc/apache2/ssl/ssl.key
    ServerAdmin webmaster@wolfsellers.com
    ServerName magento.ckt
    ServerAlias www.magento.ckt
    DocumentRoot /var/www/html/
    ErrorLog /var/www/magento.ckt/logs/magento_error.log
    LogLevel warn
    CustomLog /var/www/magento.ckt/logs/magento_access.log combined
</VirtualHost>
