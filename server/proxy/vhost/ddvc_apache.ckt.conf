<VirtualHost *:443>
    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/ssl.crt
    SSLCertificateKeyFile /etc/apache2/ssl/ssl.key
    ServerAdmin webmaster@wolfsellers.com
    ServerName ddvc.ckt
    ServerAlias www.ddvc.ckt
    DocumentRoot /var/www/html/
    ErrorLog /var/www/ddvc.ckt/logs/ddvc_error.log
    LogLevel warn
    CustomLog /var/www/ddvc.ckt/logs/ddvc_access.log combined
</VirtualHost>
