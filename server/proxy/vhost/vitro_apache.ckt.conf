<VirtualHost *:443>
    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/ssl.crt
    SSLCertificateKeyFile /etc/apache2/ssl/ssl.key
    ServerAdmin webmaster@wolfsellers.com
    ServerName vitro.ckt
    ServerAlias www.vitro.ckt
    DocumentRoot /var/www/html/
    ErrorLog /var/www/vitro.ckt/logs/vitro_error.log
    LogLevel warn
    CustomLog /var/www/vitro.ckt/logs/vitro_access.log combined
</VirtualHost>
