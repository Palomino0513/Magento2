# ./vendor/bin/ece-docker 'build:compose' --expose-db-port=3306 --mode=developer --with-cron --with-xdebug
services:
 db:
   hostname: db.magento2.docker
   image: 'mariadb:10.6'
   shm_size: 2gb
   environment:
     - MYSQL_ROOT_PASSWORD=magento2
     - MYSQL_DATABASE=magento2
     - MYSQL_USER=magento2
     - MYSQL_PASSWORD=magento2
   ports:
     - '3306:3306'
   volumes:
     - '.:/app:delegated'
     - 'mymagento-magento-db:/var/lib/mysql'
   healthcheck:
     test: 'mysqladmin ping -h localhost -p magento2'
     interval: 30s
     timeout: 30s
     retries: 3
   networks:
     magento:
       aliases:
         - db.magento2.docker
 phpmyadmin:
   image: phpmyadmin/phpmyadmin
   environment:
     - PMA_HOST=db
     - PMA_USER=magento2
     - PMA_PASSWORD=magento2
     - PMA_ROOT_PASSWORD=magento2
   ports:
     - 8080:80
   networks:
     magento:
       aliases:
         - phpmyadmin.magento2.docker
 redis:
   hostname: redis.magento2.docker
   image: 'redis:7.0'
   volumes:
     - '.:/app:delegated'
   ports:
     - 6379
   sysctls:
     net.core.somaxconn: 1024
   ulimits:
     nproc: 65535
     nofile:
       soft: 20000
       hard: 40000
   healthcheck:
     test: 'redis-cli ping || exit 1'
     interval: 30s
     timeout: 30s
     retries: 3
   networks:
     magento:
       aliases:
         - redis.magento2.docker
 opensearch:
   hostname: opensearch.magento2.docker
   image: 'magento/magento-cloud-docker-opensearch:2.4-1.3.6'
   ulimits:
     memlock:
       soft: -1
       hard: -1
   environment:
     - cluster.name=docker-cluster
     - discovery.type=single-node
     - discovery.seed_hosts=opensearch
     - bootstrap.memory_lock=true
     - DISABLE_SECURITY_PLUGIN=true
   networks:
     magento:
       aliases:
         - opensearch.magento2.docker
 fpm:
   hostname: fpm.magento2.docker
   image: 'magento/magento-cloud-docker-php:8.2-fpm-1.3.6'
   extends: generic
   volumes:
     - '.:/app:delegated'
   networks:
     magento:
       aliases:
         - fpm.magento2.docker
   depends_on:
     db:
       condition: service_healthy
 web:
   hostname: web.magento2.docker
   image: 'magento/magento-cloud-docker-nginx:1.19-1.3.6'
   extends: generic
   volumes:
     - '.:/app:delegated'
   environment:
     - WITH_XDEBUG=1
     - NGINX_WORKER_PROCESSES=1
     - NGINX_WORKER_CONNECTIONS=1024
   networks:
     magento:
       aliases:
         - web.magento2.docker
   depends_on:
     fpm:
       condition: service_started
 varnish:
   hostname: varnish.magento2.docker
   image: 'magento/magento-cloud-docker-varnish:6.6-1.3.6'
   networks:
     magento:
       aliases:
         - varnish.magento2.docker
   depends_on:
     web:
       condition: service_started
 tls:
   hostname: tls.magento2.docker
   image: 'magento/magento-cloud-docker-nginx:1.19-1.3.6'
   extends: generic
   networks:
     magento:
       aliases:
         - magento2.docker
   environment:
     - NGINX_WORKER_PROCESSES=1
     - NGINX_WORKER_CONNECTIONS=1024
     - UPSTREAM_HOST=varnish
     - UPSTREAM_PORT=80
   ports:
     - '80:80'
     - '443:443'
   depends_on:
     varnish:
       condition: service_started
 fpm_xdebug:
   hostname: fpm_xdebug.magento2.docker
   image: 'magento/magento-cloud-docker-php:8.2-fpm-1.3.6'
   extends: generic
   volumes:
     - '.:/app:delegated'
   environment:
     - 'PHP_EXTENSIONS=bcmath bz2 calendar exif gd gettext intl mysqli pcntl pdo_mysql soap sockets sysvmsg sysvsem sysvshm opcache zip xsl sodium xdebug'
   networks:
     magento:
       aliases:
         - fpm_xdebug.magento2.docker
   depends_on:
     db:
       condition: service_started
 generic:
   hostname: generic.magento2.docker
   image: 'magento/magento-cloud-docker-php:8.2-cli-1.3.6'
   env_file: ./.docker/config.env
   environment:
     - MAGENTO_RUN_MODE=developer
     - 'PHP_EXTENSIONS=bcmath bz2 calendar exif gd gettext intl mysqli pcntl pdo_mysql soap sockets sysvmsg sysvsem sysvshm opcache zip xsl sodium'
     - 'SENDMAIL_PATH=/usr/local/bin/mhsendmail --smtp-addr=mailhog:1025'
 build:
   hostname: build.magento2.docker
   image: 'magento/magento-cloud-docker-php:8.2-cli-1.3.6'
   extends: generic
   volumes:
     - '.:/app:delegated'
   networks:
     magento-build:
       aliases:
         - build.magento2.docker
   depends_on:
     db:
       condition: service_healthy
     redis:
       condition: service_healthy
     opensearch:
       condition: service_healthy
 deploy:
   hostname: deploy.magento2.docker
   image: 'magento/magento-cloud-docker-php:8.2-cli-1.3.6'
   extends: generic
   volumes:
     - '.:/app:delegated'
   networks:
     magento:
       aliases:
         - deploy.magento2.docker
   depends_on:
     db:
       condition: service_healthy
     redis:
       condition: service_healthy
     opensearch:
       condition: service_healthy
 mailhog:
   hostname: mailhog.magento2.docker
   image: 'magento/magento-cloud-docker-mailhog:1.0-1.3.6'
   ports:
     - '1025:1025'
     - '8025:8025'
   networks:
     magento:
       aliases:
         - mailhog.magento2.docker
 cron:
   hostname: cron.magento2.docker
   image: 'magento/magento-cloud-docker-php:8.2-cli-1.3.6'
   extends: generic
   command: run-cron
   environment:
     CRONTAB: |-
       * * * * * root cd /app && /usr/local/bin/php bin/magento cron:run >> /app/var/log/cron.log
       30 4 * * 0,3,5 root cd /app && /usr/local/bin/php bin/magento c:c > var/log/cacheclean.log && /usr/local/bin/php bin/magento c:f > var/log/cacheflush.log >> /app/var/log/cron.log
   volumes:
     - '.:/app:delegated'
   networks:
     magento:
       aliases:
         - cron.magento2.docker
   depends_on:
     db:
       condition: service_healthy
     redis:
       condition: service_healthy
     opensearch:
       condition: service_healthy
volumes:
 mymagento-magento-db: {  }
networks:
 magento:
   driver: bridge
 magento-build:
   driver: bridge