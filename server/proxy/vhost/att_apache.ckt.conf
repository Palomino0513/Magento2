<VirtualHost *:443>
    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/ssl.crt
    SSLCertificateKeyFile /etc/apache2/ssl/ssl.key
    ServerAdmin webmaster@wolfsellers.com
    ServerName att.ckt
    ServerAlias www.att.ckt
    DocumentRoot /var/www/html/
    ErrorLog /var/www/att.ckt/logs/att_error.log
    LogLevel warn
    CustomLog /var/www/att.ckt/logs/att_access.log combined
</VirtualHost>
