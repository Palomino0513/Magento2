<VirtualHost *:443>
    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/ssl.crt
    SSLCertificateKeyFile /etc/apache2/ssl/ssl.key
    ServerAdmin webmaster@wolfsellers.com
    ServerName smurfit.ckt
    ServerAlias www.smurfit.ckt
    DocumentRoot /var/www/html/
    ErrorLog /var/www/smurfit.ckt/logs/smurfit_error.log
    LogLevel warn
    CustomLog /var/www/smurfit.ckt/logs/smurfit_access.log combined
</VirtualHost>
