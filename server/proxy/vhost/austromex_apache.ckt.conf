<VirtualHost *:443>
    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/ssl.crt
    SSLCertificateKeyFile /etc/apache2/ssl/ssl.key
    ServerAdmin webmaster@wolfsellers.com
    ServerName austromex.ckt
    ServerAlias www.austromex.ckt
    DocumentRoot /var/www/html/
    ErrorLog /var/www/austromex.ckt/logs/austromex_error.log
    LogLevel warn
    CustomLog /var/www/austromex.ckt/logs/austromex_access.log combined
</VirtualHost>
