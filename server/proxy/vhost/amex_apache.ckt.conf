<VirtualHost *:443>
    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/ssl.crt
    SSLCertificateKeyFile /etc/apache2/ssl/ssl.key
    ServerAdmin webmaster@wolfsellers.com
    ServerName amex.ckt
    ServerAlias www.amex.ckt
    DocumentRoot /var/www/html/
    ErrorLog /var/www/amex.ckt/logs/amex_error.log
    LogLevel warn
    CustomLog /var/www/amex.ckt/logs/amex_access.log combined
</VirtualHost>
