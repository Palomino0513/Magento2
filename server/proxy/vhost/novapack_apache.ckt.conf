<VirtualHost *:443>
    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/ssl.crt
    SSLCertificateKeyFile /etc/apache2/ssl/ssl.key
    ServerAdmin webmaster@wolfsellers.com
    ServerName novapack.ckt
    ServerAlias www.novapack.ckt
    DocumentRoot /var/www/html/
    ErrorLog /var/www/novapack.ckt/logs/novapack_error.log
    LogLevel warn
    CustomLog /var/www/novapack.ckt/logs/novapack_access.log combined
</VirtualHost>
