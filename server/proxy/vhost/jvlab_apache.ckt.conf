<VirtualHost *:443>
    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/ssl.crt
    SSLCertificateKeyFile /etc/apache2/ssl/ssl.key
    ServerAdmin webmaster@wolfsellers.com
    ServerName jvlab.ckt
    ServerAlias www.jvlab.ckt
    DocumentRoot /var/www/html/
    ErrorLog /var/www/jvlab.ckt/logs/jvlab_error.log
    LogLevel warn
    CustomLog /var/www/jvlab.ckt/logs/jvlab_access.log combined
</VirtualHost>
