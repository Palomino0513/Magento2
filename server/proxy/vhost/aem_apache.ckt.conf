<VirtualHost *:443>
    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/ssl.crt
    SSLCertificateKeyFile /etc/apache2/ssl/ssl.key
    ServerAdmin webmaster@wolfsellers.com
    ServerName aem.ckt
    ServerAlias www.aem.ckt
    DocumentRoot /var/www/html/
    ErrorLog /var/www/aem.ckt/logs/aem_error.log
    LogLevel warn
    CustomLog /var/www/aem.ckt/logs/aem_access.log combined
</VirtualHost>
